<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenJob — Sign in</title>
  <style>
    body { font: 16px system-ui, sans-serif; max-width: 760px; margin: 0 auto; padding: 1rem; }
    main { max-width: 22rem; margin: 4rem auto 0; }
    h1 { margin: 0 0 .25rem; font-size: 1.5rem; }
    .sub { margin: 0 0 1.5rem; color: #64748b; font-size: .9rem; }
    label { display: block; margin: .9rem 0 .35rem; font-size: .85rem; color: #475569; }
    input {
      width: 100%; box-sizing: border-box; padding: .55rem .7rem;
      border: 1px solid #e2e8f0; border-radius: .5rem; font: inherit;
    }
    input:focus { outline: 2px solid #93c5fd; outline-offset: 1px; }
    .note { min-height: 1.1em; margin: .75rem 0; font-size: .85rem; color: #b91c1c; }
    .actions { display: flex; gap: .5rem; }
    button { padding: .55rem 1rem; border-radius: .5rem; font: inherit; cursor: pointer; }
    .primary { flex: 1; border: 0; background: #0f172a; color: #fff; }
    .secondary { border: 1px solid #e2e8f0; background: #fff; color: #0f172a; }
    button:disabled { opacity: .6; cursor: default; }
  </style>
</head>
<body>
  <main>
    <h1>OpenJob</h1>
    <p class="sub">Sign in, or create an account with your email.</p>
    <form id="auth" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p id="note" class="note" role="status"></p>
      <div class="actions">
        <button class="primary" value="login">Sign in</button>
        <button class="secondary" value="signup">Create account</button>
      </div>
    </form>
  </main>

  <script>
    const form = document.getElementById('auth');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const note = document.getElementById('note');
    const buttons = form.querySelectorAll('button');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      note.textContent = '';
      buttons.forEach((button) => { button.disabled = true; });
      const action = event.submitter ? event.submitter.value : 'login';
      try {
        const response = await fetch('/api/auth/' + action, {
          method: 'POST',
          body: new URLSearchParams({ email: email.value, password: password.value })
        });
        if (response.status === 204) {
          location.replace('/');
          return;
        }
        const problem = await response.json().catch(() => ({}));
        note.textContent = problem.message || 'Something went wrong. Try again.';
      } catch (err) {
        note.textContent = 'Something went wrong. Try again.';
      } finally {
        buttons.forEach((button) => { button.disabled = false; });
      }
    });
  </script>
</body>
</html>
