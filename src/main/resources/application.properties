spring.config.import=optional:file:.env[.properties]
# Required: there is no default. A missing path must stop the app, not write
# the board into whatever directory the process happens to start in.
spring.datasource.url=jdbc:sqlite:${OPENJOB_DB_PATH}?busy_timeout=5000
spring.datasource.hikari.maximum-pool-size=1
spring.sql.init.mode=always

# Operational surface: probes and Prometheus metrics on their own port so the
# public Service only ever exposes the application itself.
management.server.port=${MANAGEMENT_PORT:9090}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never

# Histograms, not just summaries: the dashboard needs quantiles over buckets.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.openjob.agent.request.duration=true
management.metrics.distribution.slo.openjob.agent.request.duration=5s,15s,30s,60s,120s,300s,600s

# Public traffic arrives through the Cloudflare tunnel.
server.forward-headers-strategy=framework

# Anonymous browser identity. The cookie is minted on the first page load, lives
# for 180 days, and is the whole account; HTTPS is required in production.
openjob.cookie.secure=${OPENJOB_COOKIE_SECURE:false}
