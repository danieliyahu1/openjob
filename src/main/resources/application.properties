spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:sqlite:${OPENJOB_DB_PATH:openjob.db}?busy_timeout=5000
spring.datasource.hikari.maximum-pool-size=1
spring.sql.init.mode=always

# Operational surface: probes and Prometheus metrics on their own port so the
# public Service only ever exposes the application itself.
management.server.port=${MANAGEMENT_PORT:9090}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never

# Histograms, not just summaries: the dashboard needs quantiles over buckets.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.openjob.agent.request.duration=true
management.metrics.distribution.slo.openjob.agent.request.duration=5s,15s,30s,60s,120s,300s,600s

# Public traffic arrives through the Cloudflare tunnel.
server.forward-headers-strategy=framework

# Sign-in session: idle timeout, and a cookie that cross-site POSTs cannot use.
server.servlet.session.timeout=30m
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
