# Telegram destination for the page's Feedback button. Both keys are optional:
# until they exist the endpoint answers 503 and the dashboard shows the
# "disabled" outcome, so nothing is silently dropped.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openjob-feedback
  namespace: openjob
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: openjob-feedback
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: TELEGRAM_FEEDBACK_BOT_TOKEN
      remoteRef:
        key: openjob_telegram_feedback_bot_token
    - secretKey: TELEGRAM_FEEDBACK_CHAT_ID
      remoteRef:
        key: openjob_telegram_feedback_chat_id
