apiVersion: apps/v1
kind: Deployment
metadata:
  name: openjob
  namespace: openjob
  labels:
    app.kubernetes.io/name: openjob
    app.kubernetes.io/component: web
spec:
  # SQLite is a single writer, so exactly one replica and no overlap on rollout.
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: openjob
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openjob
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openjob
          image: ghcr.io/danieliyahu1/openjob:97aaa79c82bb7731a7f033089dd812454cffc470
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: openjob-config
          env:
            # Fed by OCI Vault through the openjob-secrets ExternalSecret. The
            # references are optional so the pod starts before the Vault entries
            # exist; the chat starts working as soon as they do.
            - name: OPENCLAW_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openjob-secrets
                  key: OPENCLAW_GATEWAY_TOKEN
                  optional: true
            - name: OPENJOB_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openjob-secrets
                  key: OPENCLAW_GATEWAY_TOKEN
                  optional: true
            # Anonymous feedback is delivered to Telegram; without these the
            # endpoint answers 503 instead of silently dropping the message.
            - name: TELEGRAM_FEEDBACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openjob-feedback
                  key: TELEGRAM_FEEDBACK_BOT_TOKEN
                  optional: true
            - name: TELEGRAM_FEEDBACK_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: openjob-feedback
                  key: TELEGRAM_FEEDBACK_CHAT_ID
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openjob-data
        - name: tmp
          emptyDir: {}
