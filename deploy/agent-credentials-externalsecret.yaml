# Board sign-in details the agent skills read from the environment instead of
# from committed Markdown. The Deployment references every key as optional, so
# the app and the agent start before these Vault entries exist; until they do,
# the LinkedIn and e-mail verification flows cannot sign in.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openjob-agent-credentials
  namespace: openjob
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: openjob-agent-credentials
    creationPolicy: Owner
  data:
    - secretKey: LINKEDIN_EMAIL
      remoteRef:
        key: openjob_linkedin_email
    - secretKey: LINKEDIN_PASSWORD
      remoteRef:
        key: openjob_linkedin_password
    - secretKey: EMAIL_PRIMARY_ADDRESS
      remoteRef:
        key: openjob_email_primary_address
    - secretKey: EMAIL_PRIMARY_PASSWORD
      remoteRef:
        key: openjob_email_primary_password
    - secretKey: EMAIL_SECONDARY_ADDRESS
      remoteRef:
        key: openjob_email_secondary_address
    - secretKey: EMAIL_SECONDARY_PASSWORD
      remoteRef:
        key: openjob_email_secondary_password
