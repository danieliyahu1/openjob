apiVersion: v1
kind: Service
metadata:
  name: openjob
  namespace: openjob
  labels:
    app.kubernetes.io/name: openjob
    app.kubernetes.io/component: web
spec:
  # The Cloudflare tunnel reaches this ClusterIP directly; nothing is exposed
  # on the node.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: openjob
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
