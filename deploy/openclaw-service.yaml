apiVersion: v1
kind: Service
metadata:
  name: openclaw
  namespace: openjob
  labels:
    app.kubernetes.io/name: openclaw
    app.kubernetes.io/component: agent
spec:
  # Cluster-internal only: the gateway must never be reachable from the internet.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: openclaw
    app.kubernetes.io/component: agent
  ports:
    - name: gateway
      port: 18789
      targetPort: gateway
