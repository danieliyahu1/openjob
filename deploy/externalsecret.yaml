# Values come from OCI Vault through the oci-vault ClusterSecretStore. Only the
# Vault entry NAMES live in Git; the values are supplied out of band.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openjob-secrets
  namespace: openjob
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: openjob-secrets
    creationPolicy: Owner
    # Never delete the running app's Secret just because Vault is unavailable.
    deletionPolicy: Retain
  data:
    # Shared token: authenticates the app to the gateway, and the agent back to
    # the app's /api/* endpoints (X-OpenJob-Token).
    - secretKey: OPENCLAW_GATEWAY_TOKEN
      remoteRef:
        key: openjob_gateway_token
    # Model provider for the openjob agent.
    - secretKey: OPENCODE_API_KEY
      remoteRef:
        key: openjob_opencode_api_key
