apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  namespace: openjob
  labels:
    app.kubernetes.io/name: openclaw
    app.kubernetes.io/component: agent
spec:
  # One browser profile per agent; runs are sequential by design.
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: openclaw
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openclaw
        app.kubernetes.io/component: agent
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      # The image already runs as the unprivileged `node` user.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Seeds the persisted config and rebuilds every agent from the image's
        # template agent before the gateway reads it.
        - name: prepare-data
          image: ghcr.io/danieliyahu1/openjob-agent:3d60dbaf523c865e19fabf429de8fed350bd05b6
          imagePullPolicy: IfNotPresent
          command: ["node", "/opt/openjob/merge-config.mjs"]
          env:
            - name: OPENCLAW_DATA_ROOT
              value: /data
            - name: OPENCLAW_DEFAULT_CONFIG
              value: /opt/openjob/openclaw.default.json
            - name: AGENT_WORKSPACES_ROOT
              value: /home/node/.openclaw/workspaces
            - name: TEMPLATE_AGENT
              value: main
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
        # Copies the provided skills and AGENTS.md into every existing
        # workspace so a skill fix reaches users who already have one.
        - name: sync-workspaces
          image: ghcr.io/danieliyahu1/openjob-agent:3d60dbaf523c865e19fabf429de8fed350bd05b6
          imagePullPolicy: IfNotPresent
          command: ["node", "/opt/openjob/sync-workspace.mjs"]
          env:
            - name: WORKSPACES_ROOT
              value: /data/workspaces
            - name: TEMPLATE_WORKSPACE
              value: /home/node/.openclaw/workspace
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: openclaw
          image: ghcr.io/danieliyahu1/openjob-agent:3d60dbaf523c865e19fabf429de8fed350bd05b6
          imagePullPolicy: IfNotPresent
          ports:
            - name: gateway
              containerPort: 18789
          env:
            # The live config is on the PVC; the image copy is the template the
            # init container merges from.
            - name: OPENCLAW_CONFIG_PATH
              value: /home/node/.openclaw/config/openclaw.json
            # Fed by OCI Vault through the openjob-secrets ExternalSecret. Optional
            # so the gateway starts before the Vault entries exist.
            - name: OPENCODE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openjob-secrets
                  key: OPENCODE_API_KEY
                  optional: true
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openjob-secrets
                  key: OPENCLAW_GATEWAY_TOKEN
                  optional: true
            # The board client shipped in the image talks back to the app.
            - name: OPENJOB_API_URL
              value: http://openjob.openjob.svc.cluster.local
            # Optional: the skills read these instead of committed credentials.
            - name: LINKEDIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: openjob-agent-credentials
                  key: LINKEDIN_EMAIL
                  optional: true
            - name: LINKEDIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openjob-agent-credentials
                  key: LINKEDIN_PASSWORD
                  optional: true
            - name: EMAIL_PRIMARY_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: openjob-agent-credentials
                  key: EMAIL_PRIMARY_ADDRESS
                  optional: true
            - name: EMAIL_PRIMARY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openjob-agent-credentials
                  key: EMAIL_PRIMARY_PASSWORD
                  optional: true
            - name: EMAIL_SECONDARY_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: openjob-agent-credentials
                  key: EMAIL_SECONDARY_ADDRESS
                  optional: true
            - name: EMAIL_SECONDARY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openjob-agent-credentials
                  key: EMAIL_SECONDARY_PASSWORD
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            # Chromium is the expensive part: the browser image needs well over
            # 2GiB once a page is loaded, so the limit leaves room for it.
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 3Gi
          startupProbe:
            httpGet:
              path: /startupz
              port: gateway
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /startupz
              port: gateway
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: gateway
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          volumeMounts:
            # Chromium needs shared memory larger than the 64Mi default.
            - name: shm
              mountPath: /dev/shm
            # Persistent data. The workspace template stays in the container so
            # image updates keep applying to new workspaces.
            - name: data
              mountPath: /home/node/.openclaw/workspaces
              subPath: workspaces
            # The live config, seeded and reconciled from the image at startup.
            - name: data
              mountPath: /home/node/.openclaw/config
              subPath: config
            # Automations, run history, approvals and registries.
            - name: data
              mountPath: /home/node/.openclaw/state
              subPath: state
            # Per-agent sessions, transcripts, memory and auth state.
            - name: data
              mountPath: /home/node/.openclaw/agents
              subPath: agents
        - name: provisioner
          image: ghcr.io/danieliyahu1/openjob-agent:3d60dbaf523c865e19fabf429de8fed350bd05b6
          imagePullPolicy: IfNotPresent
          command: ["node", "/opt/openjob/provisioner.mjs"]
          ports:
            - name: provisioner
              containerPort: 18790
          env:
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openjob-secrets
                  key: OPENCLAW_GATEWAY_TOKEN
            - name: WORKSPACES_ROOT
              value: /home/node/.openclaw/workspaces
            - name: TEMPLATE_WORKSPACE
              value: /home/node/.openclaw/workspace
            - name: TEMPLATE_AGENT
              value: main
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: provisioner
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /home/node/.openclaw/workspaces
              subPath: workspaces
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: data
          persistentVolumeClaim:
            claimName: openclaw-data
