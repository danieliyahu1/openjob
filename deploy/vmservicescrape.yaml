apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: openjob
  namespace: openjob
  labels:
    app.kubernetes.io/name: openjob
    app.kubernetes.io/component: metrics
spec:
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app.kubernetes.io/name: openjob
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      path: /actuator/prometheus
      interval: 20s
