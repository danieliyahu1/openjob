apiVersion: v1
kind: ConfigMap
metadata:
  name: openjob-config
  namespace: openjob
  labels:
    app.kubernetes.io/name: openjob
data:
  # The agent runs beside the app in this namespace; both names resolve inside
  # the cluster only.
  OPENCLAW_URL: http://openclaw.openjob.svc.cluster.local:18789
  PROVISIONER_URL: http://openclaw.openjob.svc.cluster.local:18790
  # SQLite lives on a persistent volume so the board survives restarts.
  OPENJOB_DB_PATH: /data/openjob.db
  MANAGEMENT_PORT: "9090"
  # Public traffic is HTTPS at the Cloudflare edge; local dev stays on http.
  SESSION_COOKIE_SECURE: "true"
