name: Build and deliver

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify
      - name: Check and test the sidecar scripts
        run: |
          for file in deploy/openclaw/*.mjs \
                      deploy/openclaw/workspace/scripts/*.mjs \
                      deploy/openclaw/workspace/skills/cv-adjustment/scripts/*.cjs; do
            node --check "$file"
          done
          node --test deploy/openclaw/sync-workspace.test.mjs
      - name: Validate Kubernetes manifests
        run: |
          curl -sSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          /tmp/kubeconform -summary -ignore-missing-schemas deploy/*.yaml

  image:
    if: github.event_name != 'pull_request' && github.actor != 'github-actions[bot]'
    needs: verify
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: openjob
            context: .
          - name: openjob-agent
            context: deploy/openclaw
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  update-manifest:
    # Git is the deployment handoff: pin the exact images that were just built
    # and let Argo CD reconcile. The bot commit ends the flow.
    if: github.event_name != 'pull_request' && github.actor != 'github-actions[bot]'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Pin manifests to the published images
        env:
          SHA: ${{ github.sha }}
          OWNER: ${{ env.OWNER }}
        run: |
          APP_IMAGE="${REGISTRY}/${OWNER}/openjob:${SHA}"
          AGENT_IMAGE="${REGISTRY}/${OWNER}/openjob-agent:${SHA}"
          sed -i -E "s|^([[:space:]]*image:[[:space:]]*)ghcr\.io/[^/]+/openjob:[^[:space:]]*$|\1${APP_IMAGE}|" deploy/deployment.yaml
          sed -i -E "s|^([[:space:]]*image:[[:space:]]*)ghcr\.io/[^/]+/openjob-agent:[^[:space:]]*$|\1${AGENT_IMAGE}|" deploy/openclaw-deployment.yaml
          if grep -q ':bootstrap$' deploy/deployment.yaml deploy/openclaw-deployment.yaml; then
            echo "manifest pinning did not match the image lines" >&2
            exit 1
          fi
          grep -n 'image: ghcr.io' deploy/deployment.yaml deploy/openclaw-deployment.yaml
      - name: Commit the delivery handoff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/deployment.yaml deploy/openclaw-deployment.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore: pin images to ${GITHUB_SHA}"
          git push origin HEAD:main
