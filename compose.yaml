services:
  openclaw:
    build: ./deploy/openclaw
    environment:
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:?}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?}
      PLANE_API_KEY: ${PLANE_API_KEY:-}
      OPENJOB_API_URL: http://openjob:8080
      OPENJOB_API_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?}
    volumes:
      - workspaces:/home/node/.openclaw/workspaces
      - state:/home/node/.openclaw/state
      - agents:/home/node/.openclaw/agents

  provisioner:
    build: ./deploy/openclaw
    command: ["node", "/opt/openjob/provisioner.mjs"]
    environment:
      OPENCLAW_GATEWAY_URL: ws://openclaw:18789
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?}
      WORKSPACES_ROOT: /home/node/.openclaw/workspaces
      TEMPLATE_WORKSPACE: /home/node/.openclaw/workspace
    volumes:
      - workspaces:/home/node/.openclaw/workspaces

  openjob:
    build: .
    environment:
      OPENCLAW_URL: http://openclaw:18789
      OPENCLAW_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?}
      PROVISIONER_URL: http://provisioner:18790
      OPENJOB_API_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?}
    ports:
      - "8080:8080"

volumes:
  workspaces:
  state:
  agents:
